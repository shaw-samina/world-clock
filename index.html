<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <title>World Clock</title>
  </head>
  <body>
    <h1>World Clock</h1>
    <div class="container">
      <select name="city" id="cities" class="cities">
        <option value="">Select a city...</option>
        <option value="">New York</option>
        <option value="">London</option>
        <option value="">Tokyo</option>
      </select>
      <div class="city-list">
        <div>
          <h2>Los Angeles</h2>
          <div class="date">December 26th 2025</div>
        </div>
        <div>
          <div class="time">07:34 <small>am</small></div>
        </div>
      </div>
      <div class="city-list">
        <div>
          <h2>Sydney</h2>
          <div class="date">December 26th 2025</div>
        </div>
        <div>
          <div class="time">07:34 <small>am</small></div>
        </div>
      </div>
    </div>
    <footer>
      This project was coded by Samina Shaw and is open sourced on
      <a href="https://github.com/shaw-samina/" target="_blank" class="github"
        >Github</a
      >
    </footer>
    <script src="script/script.js"></script>
  </body>
</html>
