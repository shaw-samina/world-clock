<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>World Clock</title>
  </head>
  <body>
    <h1>World Clock</h1>
    <div class="container">
      <select name="city" id="cities" class="cities">
        <option value="">Select a city...</option>
        <option value="">New York</option>
        <option value="">London</option>
        <option value="">Tokyo</option>
      </select>
    </div>
    <div class="city-list">
      <h2>Los Angeles</h2>
      <div class="date">December 20th 2025</div>
      <div class="time">12:21am</div>
      <h2>Bangkok</h2>
      <div class="date">December 20th 2025</div>
      <div class="time">12:21am</div>
    </div>
    <footer>
      This project was coded by Samina Shaw and is open sourced on
      <a href="https://github.com/shaw-samina/" target="_blank" class="github"
        >Github</a
      >
    </footer>
    <script src="script/script.js"></script>
  </body>
</html>
